CONFIG_ZMK_SLEEP=y

# enable pinctrl
CONFIG_PINCTRL=y

# enable GPIO
CONFIG_GPIO=y

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Enable SPI
CONFIG_SPI=y

# EXT POWER
CONFIG_ZMK_EXT_POWER=y

# Input support
CONFIG_INPUT=y

# Enable display drivers for peripheral
CONFIG_ZMK_DISPLAY=y

# Enable peripheral animation with Pokemon
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y

# BLE - Peripheral configuration
CONFIG_BT_BAS=n

# BLE-passkey
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# BLE-clean
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# USB device name
CONFIG_USB_DEVICE_MANUFACTURER="Eyelash Peripherals"

# BLE transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
