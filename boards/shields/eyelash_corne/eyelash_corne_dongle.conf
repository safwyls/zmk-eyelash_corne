CONFIG_ZMK_SLEEP=y

# enable pinctrl
CONFIG_PINCTRL=y

# enable GPIO
CONFIG_GPIO=y

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# BLE configuration
CONFIG_BT_BAS=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# BLE-passkey
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# BLE-clean
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# USB device name
CONFIG_USB_DEVICE_MANUFACTURER="Eyelash Peripherals"
CONFIG_ZMK_KEYBOARD_NAME="Eyelash Corne"

# BLE transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# HID configuration
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
