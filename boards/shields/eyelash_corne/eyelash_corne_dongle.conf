CONFIG_ZMK_SLEEP=y

# enable pinctrl
CONFIG_PINCTRL=y

# enable GPIO
CONFIG_GPIO=y

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Enable SPI
CONFIG_SPI=y

# Enable input
CONFIG_INPUT=y

# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# BLE configuration
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# BLE connection settings for 2 peripherals + 3 profiles
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# BLE-passkey
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# BLE-clean
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# USB device name
CONFIG_USB_DEVICE_MANUFACTURER="Eyelash Peripherals"
CONFIG_ZMK_KEYBOARD_NAME="Eyelash Corne"

# BLE transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# HID configuration
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# Display configuration
CONFIG_ZMK_DISPLAY=y

# EXT POWER
CONFIG_ZMK_EXT_POWER=y

# EC11 encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Pointing device support
CONFIG_ZMK_POINTING=y
